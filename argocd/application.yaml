apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: purse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Debolar/purse-wallet-demo.git
    targetRevision: main
    path: k8s                     # Argo CD watches this folder
  destination:
    server: https://kubernetes.default.svc
    namespace: purse
  syncPolicy:
    automated:
      prune: true                 # remove what's deleted from Git
      selfHeal: true              # undo manual changes in the cluster
