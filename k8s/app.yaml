apiVersion: apps/v1
kind: Deployment
metadata:
  name: purse
  namespace: purse
spec:
  replicas: 2
  selector:
    matchLabels: { app: purse }
  template:
    metadata:
      labels: { app: purse }
    spec:
      automountServiceAccountToken: false     # no Kubernetes API key inside the Pod
      securityContext:                        # rules for the whole Pod
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: purse
          image: ghcr.io/debolar/pure-wallet-demo:c981b7184ad98ad4f3fe8586e7980a2c63d07f1e
          ports:
            - containerPort: 8080
          env:
            - { name: DATABASE_URL, value: "jdbc:postgresql://db:5432/purse" }
            - { name: DB_USER, value: purse }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef: { name: admin-key, key: ADMIN_API_KEY }
            - { name: APP_ENV, value: kubernetes }
          securityContext:                    # rules for this container
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }  # the only writable folder
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: purse
  namespace: purse
spec:
  selector: { app: purse }
  ports:
    - port: 80
      targetPort: 8080
