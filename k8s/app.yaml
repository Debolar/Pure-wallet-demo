apiVersion: apps/v1
kind: Deployment
metadata:
  name: purse
  namespace: purse
spec:
  replicas: 2
  selector:
    matchLabels: { app: purse }
  template:
    metadata:
      labels: { app: purse }
    spec:
      containers:
        - name: purse
          image: ghcr.io/debolar/pure-wallet-demo:c409fd0bbadc2bd7f665d6b99e09fb78dce84105
          ports:
            - containerPort: 8080
          env:
            - { name: DATABASE_URL, value: "jdbc:postgresql://db:5432/purse" }
            - { name: DB_USER, value: purse }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef: { name: admin-key, key: ADMIN_API_KEY }
            - { name: APP_ENV, value: kubernetes }
          startupProbe:               # Java is slow to start: allow up to 150 s
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:              # failing -> restart the container
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:             # failing -> no traffic to this Pod
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: purse
  namespace: purse
spec:
  selector: { app: purse }
  ports:
    - port: 80
      targetPort: 8080
