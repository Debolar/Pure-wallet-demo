spring.application.name=purse
server.port=8080
# Finish in-flight requests before stopping (important during rolling updates)
server.shutdown=graceful

# Database. Empty DATABASE_URL = in-memory H2 (data is lost on restart).
# Real example: jdbc:postgresql://db:5432/purse
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:purse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Actuator: health checks for Kubernetes, metrics for Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Readiness fails when the database is unreachable, so Kubernetes stops sending traffic
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=purse

# App settings
app.version=${APP_VERSION:dev}
app.env=${APP_ENV:local}
# Secret. Empty = admin API switched off. Never put the real value in Git.
app.admin-api-key=${ADMIN_API_KEY:}
