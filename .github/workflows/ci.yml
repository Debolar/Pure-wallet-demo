name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/debolar/pure-wallet-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven                 # reuse downloaded libraries between runs
      - run: mvn -B verify             # compile + all 19 tests

  build:
    needs: test                        # only if tests pass
    if: github.event_name == 'push'    # only on merge to main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                  # lets GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP_VERSION=${{ github.sha }} -t $IMAGE:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.35.0   # pinned: older tags were hijacked in 2026
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true         # only fail on problems that have a fix available
          exit-code: "0"   # TEMPORARY: report only, set back to "1" in Stage 7               # fail the pipeline if any are found
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker push $IMAGE:${{ github.sha }}
